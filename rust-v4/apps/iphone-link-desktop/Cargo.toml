[package]
name = "iphone-link-desktop"
version = "5.0.1"
edition = "2021"

[[bin]]
name = "iphone-link-v4"
path = "src/main.rs"

[dependencies]
iphone-link-apple = { path = "../../crates/iphone-link-apple" }
iphone-link-video = { path = "../../crates/iphone-link-video" }
iphone-link-audio = { path = "../../crates/iphone-link-audio" }
serde_json = { path = "../../vendor/serde_json" }
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030", "raw-window-handle-06"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1"
