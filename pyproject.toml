[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-link"
version = "1.0.0"
description = "iPhone Link — Native iPhone Mirroring and Control for Windows 11"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymobiledevice3>=11.28",
    "pywebview>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["handset*"]

